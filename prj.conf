CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_LED=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y


CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y


CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NETWORKING=y


# Enable Sockets (used by MQTT lib)
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y


# Enable Mbed TLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# Enable MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y


# DNS for broker hostname resolution
CONFIG_DNS_RESOLVER=y
CONFIG_NET_HOSTNAME_ENABLE=y

# Enable Posix API functionality
CONFIG_POSIX_API=y


# Main stack size
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# System work queue stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Increase Rx net buffers
CONFIG_NET_BUF_RX_COUNT=100

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y


CONFIG_NET_SAMPLE_MQTT_BROKER_HOSTNAME="broker.hivemq.com"
CONFIG_NET_SAMPLE_MQTT_BROKER_PORT="8883"
CONFIG_NET_SAMPLE_MQTT_PUBLISH_INTERVAL=10


#json
CONFIG_JSON_LIBRARY=y

CONFIG_MBEDTLS_DEBUG=y


CONFIG_HTTP_SERVER=y
CONFIG_WIFI_SAMPLE_AP_IP_ADDRESS="192.168.4.1"


CONFIG_ZVFS_EVENTFD_MAX=4



# CONFIG_SHELL=y
# CONFIG_NET_SHELL=y

CONFIG_LOG_DEFAULT_LEVEL=1


CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=20